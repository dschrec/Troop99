<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Troop 99 Scouts</title>
  <meta name="description" content="Troop 99 Scouts admin panel for managing website content.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* ===== ADMIN SPECIFIC STYLES ===== */
    .admin-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 100vh;
    }
    .admin-sidebar {
      background: var(--navy);
      color: var(--white);
      padding: 2rem 0;
      position: sticky;
      top: 0;
      left: 0;
      bottom: 0;
      width: 240px;
      height: 100vh;
      overflow-y: auto;
      z-index: 20;
    }
    .admin-sidebar-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0 1.5rem;
      margin-bottom: 2rem;
      font-weight: 700;
      font-size: 1.125rem;
    }
    .admin-sidebar-logo .logo-mark {
      width: 36px;
      height: 36px;
      min-width: 36px;
      font-size: 0.875rem;
    }
    .admin-nav-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1.5rem;
      color: #FFFFFF80;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: var(--font-body);
    }
    .admin-nav-item:hover {
      color: var(--white);
      background: #FFFFFF10;
    }
    .admin-nav-item.active {
      color: var(--gold);
      background: #FFFFFF0A;
      border-left: 3px solid var(--gold);
    }
    .admin-nav-icon { font-size: 1.125rem; }
    .admin-main {
      background: var(--off-white);
      min-height: 100vh;
      width: 100%;
      min-width: 0;
    }
    .admin-header {
      background: var(--white);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--gray-100);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .admin-header h2 {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      color: var(--navy);
    }
    .admin-export-btn {
      padding: 0.5rem 1rem;
      background: var(--navy);
      color: var(--white);
      border: none;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: var(--font-body);
    }
    .admin-export-btn:hover { background: var(--navy-light); }
    .admin-content {
      padding: 2rem 3rem;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }
    .admin-section { display: none; }
    .admin-section.active { display: block; }
    .admin-card {
      background: var(--white);
      border: 1px solid var(--gray-100);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }
    .admin-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .admin-card-title {
      font-weight: 600;
      color: var(--navy);
    }
    .admin-delete-btn {
      padding: 0.375rem 0.75rem;
      background: #FF4444;
      color: var(--white);
      border: none;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: var(--font-body);
    }
    .admin-delete-btn:hover { background: #CC0000; }
    .admin-edit-btn {
      padding: 0.375rem 0.75rem;
      background: var(--gold);
      color: var(--navy);
      border: none;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-right: 0.5rem;
      font-family: var(--font-body);
    }
    .admin-edit-btn:hover { background: var(--gold-light); }
    .admin-form { display: flex; flex-direction: column; gap: 1rem; }
    .admin-form .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
    .admin-form label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--navy);
    }
    .admin-form input,
    .admin-form textarea,
    .admin-form select {
      padding: 0.75rem 1rem;
      border: 1px solid var(--gray-200);
      border-radius: 6px;
      font-family: var(--font-body);
      font-size: 0.875rem;
    }
    .admin-form textarea { min-height: 100px; resize: vertical; }
    .admin-save-btn {
      padding: 0.75rem 1.5rem;
      background: var(--gold);
      color: var(--navy);
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font-body);
      transition: all 0.2s;
    }
    .admin-save-btn:hover { background: var(--gold-light); }
    .admin-list { display: flex; flex-direction: column; gap: 1rem; }
    .admin-list-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      border: 1px solid var(--gray-100);
      border-radius: 8px;
      background: var(--white);
    }
    .admin-list-item.dragging { opacity: 0.5; border-style: dashed; }
    .admin-drag-handle {
      cursor: grab;
      color: var(--gray-400);
      font-size: 1.25rem;
      user-select: none;
    }
    .admin-item-title {
      font-weight: 600;
      color: var(--navy);
      flex: 1;
    }
    .admin-item-desc {
      font-size: 0.875rem;
      color: var(--gray-600);
      flex: 2;
    }
    .admin-item-actions { display: flex; gap: 0.5rem; }
    .admin-modal-overlay {
      position: fixed;
      inset: 0;
      background: #00000080;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .admin-modal-overlay.active { display: flex; }
    .admin-modal {
      background: var(--white);
      border-radius: 16px;
      padding: 2rem;
      width: 90%;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
    }
    .admin-modal h3 {
      font-family: var(--font-heading);
      font-size: 1.25rem;
      color: var(--navy);
      margin-bottom: 1.5rem;
    }
    .admin-close-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--gray-400);
    }
    .admin-toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--navy);
      color: var(--white);
      padding: 1rem 1.5rem;
      border-radius: 8px;
      font-weight: 500;
      z-index: 200;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s ease;
    }
    .admin-toast.show {
      transform: translateY(0);
      opacity: 1;
    }
    .admin-add-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: var(--gold);
      color: var(--navy);
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font-body);
      transition: all 0.2s;
      margin-bottom: 1rem;
    }
    .admin-add-btn:hover { background: var(--gold-light); }
    .admin-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .admin-stat-card {
      background: var(--white);
      border: 1px solid var(--gray-100);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
    }
    .admin-stat-number {
      display: block;
      font-family: var(--font-heading);
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--gold);
    }
    .admin-stat-label {
      font-size: 0.875rem;
      color: var(--gray-600);
    }
    @media (max-width: 768px) {
      .admin-layout { grid-template-columns: 1fr; }
      .admin-sidebar {
        position: relative;
        width: 100%;
        padding: 1rem 0;
      }
      .admin-main { margin-left: 0; }
      .admin-header { padding: 1rem; }
    }
  </style>
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div class="admin-sidebar-logo">
        <span class="logo-mark">99</span>
        <span>Admin Panel</span>
      </div>
      <nav>
        <button class="admin-nav-item active" data-section="dashboard">
          <span class="admin-nav-icon">📊</span> Dashboard
        </button>
        <button class="admin-nav-item" data-section="slides">
          <span class="admin-nav-icon">🖼️</span> Slides
        </button>
        <button class="admin-nav-item" data-section="events">
          <span class="admin-nav-icon">📅</span> Events
        </button>
        <button class="admin-nav-item" data-section="gallery">
          <span class="admin-nav-icon">📸</span> Gallery
        </button>
        <button class="admin-nav-item" data-section="messages">
          <span class="admin-nav-icon">✉️</span> Messages
        </button>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <div class="admin-header">
        <h2 id="adminTitle">Dashboard</h2>
        <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
          <button class="admin-export-btn" onclick="downloadDataJSON()">💾 Download data.json</button>
          <button class="admin-export-btn" onclick="exportData()">📥 Export All</button>
          <button class="admin-export-btn" onclick="document.getElementById('importInput').click()">📤 Import</button>
          <input type="file" id="importInput" accept=".json" style="display: none;" onchange="importData(event)">
        </div>
      </div>

      <div class="admin-content">
        <!-- Dashboard Section -->
        <div class="admin-section active" id="section-dashboard">
          <div class="admin-stats-grid" id="statsGrid">
            <div class="admin-stat-card">
              <span class="admin-stat-number" id="statSlides">0</span>
              <span class="admin-stat-label">Slides</span>
            </div>
            <div class="admin-stat-card">
              <span class="admin-stat-number" id="statEvents">0</span>
              <span class="admin-stat-label">Events</span>
            </div>
            <div class="admin-stat-card">
              <span class="admin-stat-number" id="statGallery">0</span>
              <span class="admin-stat-label">Gallery Items</span>
            </div>
            <div class="admin-stat-card">
              <span class="admin-stat-number" id="statMessages">0</span>
              <span class="admin-stat-label">Messages</span>
            </div>
          </div>
          <div class="admin-card">
            <h3 class="admin-card-title">Quick Actions</h3>
            <div style="display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1rem;">
              <button class="admin-add-btn" onclick="switchSection('slides')">Manage Slides</button>
              <button class="admin-add-btn" onclick="switchSection('events')">Manage Events</button>
              <button class="admin-add-btn" onclick="switchSection('gallery')">Manage Gallery</button>
              <button class="admin-add-btn" onclick="switchSection('messages')">View Messages</button>
            </div>
          </div>
        </div>

        <!-- Slides Section -->
        <div class="admin-section" id="section-slides">
           <button class="admin-add-btn" onclick="openModal('slides')">➕ Add Slide</button>
          <div class="admin-list" id="slidesList"></div>
        </div>

        <!-- Events Section -->
        <div class="admin-section" id="section-events">
           <button class="admin-add-btn" onclick="openModal('events')">➕ Add Event</button>
          <div class="admin-list" id="eventsList"></div>
        </div>

        <!-- Gallery Section -->
        <div class="admin-section" id="section-gallery">
          <button class="admin-add-btn" onclick="openModal('gallery')">➕ Add Gallery Item</button>
          <div class="admin-list" id="galleryList"></div>
        </div>

        <!-- Messages Section -->
        <div class="admin-section" id="section-messages">
          <div class="admin-list" id="messagesList"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div class="admin-modal-overlay" id="modalOverlay">
    <div class="admin-modal" id="modalContent"></div>
  </div>

  <!-- Toast -->
  <div class="admin-toast" id="toast"></div>

  <script>
    // ===== DATA MANAGEMENT =====
    const STORAGE_KEY = 'troop99_admin_data';

    const defaultData = {
      slides: [
        { id: '1', image: 'images/summer-camp-hero.jpg', eyebrow: 'Welcome to Troop 99', title: 'Adventure Awaits', description: 'Building leaders through adventure, service, and friendship.', cta_text: 'Join Us', cta_link: 'join.html' },
        { id: '2', image: 'images/valley-forge-hero.jpg', eyebrow: 'Our Heritage', title: '65+ Years of Scouting', description: 'A legacy of adventure in Newtown, PA.', cta_text: 'Learn More', cta_link: 'about.html' },
        { id: '3', image: 'images/hero-morrell-smith.jpg', eyebrow: 'Join Our Team', title: 'Become a Volunteer', description: 'Help shape the next generation of leaders.', cta_text: 'Contact Us', cta_link: 'contact.html' }
      ],
      events: [
        { id: '1', title: 'Troop Meeting', date: 'Every Monday', description: 'Monday evenings at 7:00 PM at American Legion Post 440, Newtown, PA' },
        { id: '2', title: 'Summer Camp', date: 'June-August', description: 'Our annual summer camp adventure' },
        { id: '3', title: 'Community Service', date: 'TBA 2026', description: 'Regular service projects throughout the year' }
      ],
      gallery: [
        { id: '1', title: 'Summer Camp', image: 'images/summer-camp-hero.jpg', link: 'https://www.scaryghost.net/Share/Scouts/2023T99/2026-OSR-Summer-Camp/n-8KHTTCd', large: true },
        { id: '2', title: 'Whitewater Rafting', image: 'images/rafting-hero.jpg', link: 'https://www.scaryghost.net/Share/Scouts/2023T99/2026-Whitewater-Rafting/n-4KHTTCd' },
        { id: '3', title: 'Memorial Day Parade', image: 'images/parade-hero.jpg', link: 'https://www.scaryghost.net/Share/Scouts/2023T99/2026-Memorial-Day-Parade/n-5KHTTCd' },
        { id: '4', title: 'West Point', image: 'images/west-point-hero.jpg', link: 'https://www.scaryghost.net/Share/Scouts/2023T99/2026-April-West-Point-Camporee/n-GsqQFn' },
        { id: '5', title: 'Valley Forge', image: 'images/valley-forge-hero.jpg', link: 'https://www.scaryghost.net/Share/Scouts/2023T99/2026-March-Valley-Forge-Campout/n-RNKPdV' },
        { id: '6', title: 'MLK Service', image: 'images/mlk-hero.jpg', link: 'https://www.scaryghost.net/Share/Scouts/2023T99/2026-January-MLK-Service-Project/n-dhfZKv', tall: true }
      ],
      contact: [],
      messages: []
    };

    function loadData() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          const parsed = JSON.parse(stored);
          // Merge with defaults to ensure all keys exist
          return { ...defaultData, ...parsed };
        }
      } catch (e) {
        console.error('Failed to load data:', e);
      }
      return JSON.parse(JSON.stringify(defaultData));
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {
        console.error('Failed to save data:', e);
        showToast('Error saving data', true);
      }
    }

    let data = loadData();

    // ===== NAVIGATION =====
    document.querySelectorAll('.admin-nav-item').forEach(btn => {
      btn.addEventListener('click', () => {
        switchSection(btn.dataset.section);
      });
    });

    function switchSection(sectionName) {
      document.querySelectorAll('.admin-nav-item').forEach(n => n.classList.remove('active'));
      document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));

      const navBtn = document.querySelector(`.admin-nav-item[data-section="${sectionName}"]`);
      if (navBtn) navBtn.classList.add('active');

      const section = document.getElementById(`section-${sectionName}`);
      if (section) section.classList.add('active');

      const titles = {
        dashboard: 'Dashboard',
        slides: 'Manage Slides',
        events: 'Manage Events',
        gallery: 'Manage Gallery',
        messages: 'Messages'
      };
      document.getElementById('adminTitle').textContent = titles[sectionName] || 'Admin';

      renderCurrentSection();
    }

    function renderCurrentSection() {
      const activeSection = document.querySelector('.admin-section.active');
      if (!activeSection) return;
      const sectionId = activeSection.id.replace('section-', '');
      switch (sectionId) {
        case 'dashboard': updateStats(); break;
        case 'slides': renderSlidesList(); break;
        case 'events': renderEventsList(); break;
        case 'gallery': renderGalleryList(); break;
        case 'messages': renderMessagesList(); break;
      }
    }

    // ===== DASHBOARD =====
    function updateStats() {
      document.getElementById('statSlides').textContent = data.slides.length;
      document.getElementById('statEvents').textContent = data.events.length;
      document.getElementById('statGallery').textContent = data.gallery.length;
      document.getElementById('statMessages').textContent = data.messages.length;
    }

    // ===== SLIDES =====
    function renderSlidesList() {
      const container = document.getElementById('slidesList');
      if (!container) return;
      container.innerHTML = data.slides.map((slide, i) => `
        <div class="admin-list-item" draggable="true" data-index="${i}">
          <span class="admin-drag-handle">⠿</span>
          <img src="../${slide.image || 'images/summer-camp-hero.jpg'}" alt="${slide.eyebrow || ''}" style="width:200px;height:133px;object-fit:cover;border-radius:4px;background:var(--gray-100);flex-shrink:0;">
          <div class="admin-item-title">${slide.eyebrow || ''}</div>
          <div class="admin-item-desc">${slide.title || ''}${slide.cta_link ? ' → ' + slide.cta_link : ''}</div>
          <div class="admin-item-actions">
            <button class="admin-edit-btn" onclick="openModal('slides', '${slide.id}')">Edit</button>
            <button class="admin-delete-btn" onclick="deleteItem('slides', '${slide.id}')">Delete</button>
          </div>
        </div>
      `).join('');

      // Add drag handlers
      container.querySelectorAll('.admin-list-item').forEach(item => {
        item.addEventListener('dragstart', handleDragStart);
        item.addEventListener('dragover', handleDragOver);
        item.addEventListener('drop', handleDrop);
        item.addEventListener('dragend', handleDragEnd);
      });
    }

    function getSectionTitle(type) {
      const titles = { slides: 'slide', events: 'event', gallery: 'gallery', messages: 'message', contact: 'message' };
      return titles[type] || 'item';
    }

    // ===== EVENTS =====
    function renderEventsList() {
      const container = document.getElementById('eventsList');
      if (!container) return;
      container.innerHTML = data.events.map((ev, i) => `
        <div class="admin-list-item">
          <div class="admin-item-title">${ev.title || ''}</div>
          <div class="admin-item-desc">${ev.date || ''} — ${ev.description || ''}</div>
          <div class="admin-item-actions">
            <button class="admin-edit-btn" onclick="openModal('event', '${ev.id}')">Edit</button>
            <button class="admin-delete-btn" onclick="deleteItem('events', '${ev.id}')">Delete</button>
          </div>
        </div>
      `).join('');
    }

    // ===== GALLERY =====
    function renderGalleryList() {
      const container = document.getElementById('galleryList');
      if (!container) return;
      container.innerHTML = data.gallery.map((item, i) => `
        <div class="admin-list-item">
          <img src="../${item.image || 'images/summer-camp-hero.jpg'}" alt="${item.title || ''}" style="width:80px;height:53px;object-fit:cover;border-radius:4px;background:var(--gray-100);flex-shrink:0;">
          <div class="admin-item-title">${item.title || ''}</div>
          <div class="admin-item-desc">${item.image || ''}${item.large ? ' (large)' : ''}${item.tall ? ' (tall)' : ''}</div>
          <div class="admin-item-actions">
            <button class="admin-edit-btn" onclick="openModal('gallery', '${item.id}')">Edit</button>
            <button class="admin-delete-btn" onclick="deleteItem('gallery', '${item.id}')">Delete</button>
          </div>
        </div>
      `).join('');
    }

    // ===== MESSAGES =====
    function renderMessagesList() {
      const container = document.getElementById('messagesList');
      if (!container) return;
      if (data.messages.length === 0) {
        container.innerHTML = '<div class="admin-card"><p>No messages yet.</p></div>';
        return;
      }
      container.innerHTML = data.messages.map(msg => `
        <div class="admin-card">
          <div class="admin-card-header">
            <div class="admin-item-title">${msg.name || 'Unknown'}</div>
            <div class="admin-item-actions">
              <button class="admin-delete-btn" onclick="deleteMessage('${msg.id}')">Delete</button>
            </div>
          </div>
          <p class="admin-item-desc"><strong>Email:</strong> ${msg.email || 'N/A'}<br>
          <strong>Phone:</strong> ${msg.phone || 'N/A'}<br>
          <strong>Message:</strong><br>${msg.message || 'N/A'}</p>
          <p style="font-size: 0.75rem; color: var(--gray-400); margin-top: 0.5rem;">Received: ${msg.date || 'Unknown'}</p>
        </div>
      `).join('');
    }

    function deleteMessage(id) {
      if (!confirm('Delete this message?')) return;
      data.messages = data.messages.filter(m => m.id !== id);
      saveData();
      renderMessagesList();
      showToast('Message deleted');
    }

    // ===== DRAG AND DROP =====
    let dragIndex = null;

    function handleDragStart(e) {
      dragIndex = parseInt(this.dataset.index);
      this.classList.add('dragging');
    }

    function handleDragOver(e) {
      e.preventDefault();
    }

    function handleDrop(e) {
      e.preventDefault();
      const dropIndex = parseInt(this.dataset.index);
      if (dragIndex !== null && dragIndex !== dropIndex) {
        const item = data.slides.splice(dragIndex, 1)[0];
        data.slides.splice(dropIndex, 0, item);
        saveData();
        renderSlidesList();
      }
    }

    function handleDragEnd() {
      this.classList.remove('dragging');
      dragIndex = null;
    }

    // ===== MODALS =====
    function openModal(type, editId = null) {
      const overlay = document.getElementById('modalOverlay');
      const content = document.getElementById('modalContent');

      let item = null;
      if (editId) {
        const list = data[type] || [];
        item = list.find(i => i.id === editId);
      }

      let formHTML = getFormHTML(type, item);
      content.innerHTML = `
        <h3>${editId ? 'Edit' : 'Add'} ${getSectionTitle(type)}</h3>
        <form class="admin-form" onsubmit="return saveItem(event, '${type}', '${editId || ''}')">
          ${formHTML}
          <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
            <button type="submit" class="admin-save-btn">💾 Save</button>
            <button type="button" class="admin-delete-btn" style="display: ${editId ? 'inline-block' : 'none'};" onclick="deleteItem('${type}', '${editId}'); closeModal();">Delete</button>
            <button type="button" class="admin-delete-btn" style="background: var(--gray-400);" onclick="closeModal()">Cancel</button>
          </div>
        </form>
      `;
      overlay.classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function getFormHTML(type, item) {
      const isSlide = type === 'slides';
      const isEvent = type === 'events';
      const isGallery = type === 'gallery';

      let fields = '';

      if (isSlide) {
        fields = `
          <div class="form-group"><label>Image Path</label><input type="text" name="image" value="${item?.image || 'images/summer-camp-hero.jpg'}"></div>
          <div class="form-group"><label> Eyebrow Text</label><input type="text" name="eyebrow" value="${item?.eyebrow || ''}" placeholder="e.g., Welcome to Troop 99"></div>
          <div class="form-group"><label>Title</label><input type="text" name="title" value="${item?.title || ''}"></div>
          <div class="form-group"><label>Description</label><textarea name="description">${item?.description || ''}</textarea></div>
          <div class="form-group"><label>CTA Button Text</label><input type="text" name="cta_text" value="${item?.cta_text || ''}"></div>
          <div class="form-group"><label>CTA Link</label><input type="text" name="cta_link" value="${item?.cta_link || ''}"></div>
        `;
      } else if (isEvent) {
        fields = `
          <div class="form-group"><label>Title</label><input type="text" name="title" value="${item?.title || ''}"></div>
          <div class="form-group"><label>Date/Time</label><input type="text" name="date" value="${item?.date || ''}" placeholder="e.g., Every Monday, June-August"></div>
          <div class="form-group"><label>Description</label><textarea name="description">${item?.description || ''}</textarea></div>
        `;
      } else if (isGallery) {
        fields = `
          <div class="form-group"><label>Title</label><input type="text" name="title" value="${item?.title || ''}"></div>
          <div class="form-group"><label>Image Path</label><input type="text" name="image" value="${item?.image || 'images/summer-camp-hero.jpg'}"></div>
          <div class="form-group"><label>Album Link</label><input type="text" name="link" value="${item?.link || ''}"></div>
          <div class="form-group">
            <label>Type</label>
            <select name="type">
              <option value="normal" ${!item?.large && !item?.tall ? 'selected' : ''}>Normal</option>
              <option value="large" ${item?.large ? 'selected' : ''}>Large (span 2)</option>
              <option value="tall" ${item?.tall ? 'selected' : ''}>Tall (span 2 rows)</option>
            </select>
          </div>
        `;
      }

      return fields;
    }

    function saveItem(e, type, editId) {
      e.preventDefault();
      const form = e.target;
      const formData = new FormData(form);
      const item = {};

      for (const [key, value] of formData.entries()) {
        item[key] = value;
      }

      if (type === 'gallery') {
        item.large = item.type === 'large';
        item.tall = item.type === 'tall';
      }

      if (editId) {
        const idx = data[type].findIndex(i => i.id === editId);
        if (idx !== -1) {
          item.id = editId;
          data[type][idx] = item;
        }
      } else {
        item.id = generateId();
        data[type].push(item);
      }

      saveData();
      closeModal();
      renderCurrentSection();
      showToast(editId ? 'Updated successfully!' : 'Added successfully!');
      return false;
    }

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    function deleteItem(type, id) {
      if (!confirm('Delete this item?')) return;
      data[type] = data[type].filter(i => i.id !== id);
      saveData();
      renderCurrentSection();
      showToast('Deleted successfully');
    }

    // ===== EXPORT / IMPORT =====
    function exportData() {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'troop99-data.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast('Data exported!');
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          data = { ...defaultData, ...imported };
          saveData();
          renderCurrentSection();
          showToast('Data imported successfully!');
        } catch (err) {
          showToast('Error importing: Invalid JSON', true);
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    // ===== TOAST =====
    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.style.background = isError ? '#FF4444' : 'var(--navy)';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // ===== INIT =====
    updateStats();
    closeModal();
  
    // ===== DOWNLOAD DATA JSON =====
    function downloadDataJSON() {
      try {
        const jsonStr = JSON.stringify(data, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'data.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('data.json downloaded! Replace the file in /data/ and commit to GitHub.');
      } catch (e) {
        console.error('Failed to download:', e);
        showToast('Error downloading file', true);
      }
    }

  </script>
</body>
</html>
