<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T99 Eagles - Eagle Scout Hall of Fame</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0f0f1a; color: #e0d8c8; line-height: 1.6; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }
    
    /* Hero */
    .eagle-hero {
      background: linear-gradient(135deg, #0a0a14 0%, #1a1520 50%, #0f1923 100%);
      padding: 5rem 2rem 3rem;
      text-align: center;
      border-bottom: 3px solid #d4af37;
    }
    .eagle-hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 900;
      color: #d4af37;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }
    .eagle-hero .subtitle {
      font-size: 1.1rem;
      color: #a89b8c;
      font-weight: 300;
      margin-bottom: 1.5rem;
    }
    .eagle-hero .charter {
      font-size: 0.85rem;
      color: #6b5f52;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
    
    /* Stats Bar */
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
      padding: 1.5rem;
      background: linear-gradient(90deg, #15121a, #1a1520, #15121a);
      border-bottom: 1px solid rgba(212,175,55,0.2);
    }
    .stat {
      text-align: center;
      padding: 0 1rem;
    }
    .stat-number {
      font-family: 'Playfair Display', serif;
      font-size: 2.25rem;
      font-weight: 700;
      color: #d4af37;
      display: block;
      line-height: 1;
      margin-bottom: 0.25rem;
    }
    .stat-label {
      font-size: 0.8rem;
      color: #8a7d70;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    /* Search */
    .search-box {
      max-width: 400px;
      margin: 2rem auto;
      padding: 0 2rem;
    }
    .search-input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid rgba(212,175,55,0.3);
      border-radius: 4px;
      background: #15121a;
      color: #e8e0d0;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
    }
    .search-input:focus {
      outline: none;
      border-color: #d4af37;
      box-shadow: 0 0 0 2px rgba(212,175,55,0.2);
    }
    .search-input::placeholder { color: #6b5f52; }
    
    /* Year Nav */
    .year-nav {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      padding: 1rem;
      background: #0f0f1a;
      border-bottom: 1px solid rgba(212,175,55,0.1);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .year-btn {
      padding: 0.4rem 1rem;
      border: 1px solid rgba(212,175,55,0.3);
      border-radius: 4px;
      background: transparent;
      color: #8a7d70;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .year-btn:hover, .year-btn.active {
      background: #d4af37;
      color: #0a0a14;
      border-color: #d4af37;
    }
    
    /* Roster */
    .roster { max-width: 1200px; margin: 0 auto; padding: 3rem 2rem; }
    .year-section { margin-bottom: 4rem; }
    .year-header {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid rgba(212,175,55,0.2);
    }
    .year-badge {
      font-family: 'Playfair Display', serif;
      font-size: 1.75rem;
      font-weight: 700;
      color: #d4af37;
      background: linear-gradient(135deg, #1a1520, #251e28);
      padding: 0.4rem 1.25rem;
      border-radius: 4px;
      border: 1px solid rgba(212,175,55,0.3);
    }
    .year-count {
      font-size: 0.85rem;
      color: #6b5f52;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    /* Eagle Cards */
    .eagle-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 0.75rem;
    }
    .eagle-card {
      background: linear-gradient(135deg, #15121a, #1a1520);
      border: 1px solid rgba(212,175,55,0.15);
      border-radius: 4px;
      padding: 1rem 1.25rem;
      transition: all 0.2s;
    }
    .eagle-card:hover {
      border-color: rgba(212,175,55,0.5);
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .eagle-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: #e8e0d0;
      margin-bottom: 0.25rem;
    }
    .eagle-date {
      font-size: 0.8rem;
      color: #6b5f52;
      margin-bottom: 0.5rem;
    }
    .eagle-ribbon {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      background: rgba(212,175,55,0.15);
      color: #d4af37;
      border-radius: 3px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    /* Footer */
    .footer {
      text-align: center;
      padding: 2rem;
      border-top: 1px solid rgba(212,175,55,0.1);
      color: #6b5f52;
      font-size: 0.85rem;
    }
    
    @media (max-width: 768px) {
      .stats-bar { gap: 1rem; }
      .stat-number { font-size: 1.75rem; }
      .eagle-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <section class="eagle-hero">
    <div class="container">
      <h1>T99 Eagles</h1>
      <p class="subtitle">Eagle Scout Hall of Fame</p>
      <p class="charter">Chartered 1999 · Newtown, PA</p>
    </div>
  </section>

  <section class="stats-bar">
    <div class="stat">
      <span class="stat-number" id="totalEagles">0</span>
      <span class="stat-label">Eagle Scouts</span>
    </div>
    <div class="stat">
      <span class="stat-number" id="yearsCount">0</span>
      <span class="stat-label">Years</span>
    </div>
    <div class="stat">
      <span class="stat-number" id="thisYearCount">0</span>
      <span class="stat-label">Class of 2026</span>
    </div>
    <div class="stat">
      <span class="stat-number" id="peakYearCount">0</span>
      <span class="stat-label">Peak Year</span>
    </div>
  </section>

  <div class="search-box">
    <input type="text" class="search-input" id="search" placeholder="Search by name...">
  </div>

  <nav class="year-nav" id="yearNav"></nav>

  <main class="roster" id="roster"></main>

    // Group by year
    const byYear = {};
    eagleData.forEach(e => {
      if (!byYear[e.year]) byYear[e.year] = [];
      byYear[e.year].push(e);
    });
    
    const years = Object.keys(byYear).sort((a,b) => b-a);
    
    // Build year nav
    const nav = document.getElementById('yearNav');
    years.forEach(year => {
      const btn = document.createElement('button');
      btn.className = 'year-btn';
      btn.textContent = year;
      btn.addEventListener('click', () => {
        document.querySelectorAll('.year-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const section = document.getElementById('year-' + year);
        if (section) {
          section.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });
      nav.appendChild(btn);
    });
    
    // Stats
    document.getElementById('totalEagles').textContent = eagleData.length;
    document.getElementById('yearsCount').textContent = years.length;
    document.getElementById('thisYearCount').textContent = byYear[2026]?.length || 0;
    const peakYear = years.reduce((a, b) => byYear[b].length > byYear[a].length ? b : a);
    document.getElementById('peakYearCount').textContent = peakYear + ' (' + byYear[peakYear].length + ')';
    
    // Render roster
    function renderRoster(filter = '') {
      const roster = document.getElementById('roster');
      roster.innerHTML = '';
      
      years.forEach(year => {
        const filtered = byYear[year].filter(e => 
          filter === '' || e.name.toLowerCase().includes(filter.toLowerCase())
        );
        
        if (filtered.length === 0) return;
        
        const section = document.createElement('div');
        section.className = 'year-section';
        section.id = 'year-' + year;
        
        const header = document.createElement('div');
        header.className = 'year-header';
        header.innerHTML = `
          <span class="year-badge">${year}</span>
          <span class="year-count">${filtered.length} Eagle${filtered.length > 1 ? 's' : ''}</span>
        `;
        section.appendChild(header);
        
        const grid = document.createElement('div');
        grid.className = 'eagle-grid';
        
        filtered.forEach(e => {
          const card = document.createElement('div');
          card.className = 'eagle-card';
          card.innerHTML = `
            <div class="eagle-name">${e.name}</div>
            <div class="eagle-date">Class of ${year}</div>
            <span class="eagle-ribbon">Eagle Scout</span>
          `;
          grid.appendChild(card);
        });
        
        section.appendChild(grid);
        roster.appendChild(section);
      });
    }
    
    // Search
    document.getElementById('search').addEventListener('input', (e) => {
      renderRoster(e.target.value);
    });
    
    // Initial render
    renderRoster();
