<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ReadyState Debug</title>
</head>
<body>
<h1>ReadyState Debug Page</h1>
<pre id="log"></pre>
<script>
var log = document.getElementById('log');
function msg(text) { log.innerHTML += text + '<br>'; console.log(text); }

// This simulates what calendar.html does with document.write
msg('BEFORE document.write: readyState=' + document.readyState);

document.write('<script src="debug-ready-inner.js?' + Date.now() + '"><\/script>');

// This runs AFTER the external script loads
msg('AFTER document.write: readyState=' + document.readyState);
msg('document.getElementById("cal") = ' + (document.getElementById('cal') !== null));
</script>
</body>
</html>
