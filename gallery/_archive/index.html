<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archived Events - Troop 99 Scouts</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .archive-list { list-style: none; padding: 0; max-width: 600px; margin: 0 auto; }
    .archive-list li { margin-bottom: 1rem; }
    .archive-list a { color: var(--text-primary); text-decoration: none; font-size: 1.1rem; }
    .archive-list a:hover { color: var(--accent-blue); }
    .archive-note { max-width: 600px; margin: 2rem auto; color: var(--gray-600); font-size: 0.95rem; line-height: 1.6; }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="https://newtownscouts.org/index.html" class="nav-logo">
        <span class="logo-mark">99</span>
        <span class="logo-text">Troop 99 Newtown</span>
      </a>
    </div>
  </nav>

  <section class="section">
    <div class="container">
      <div class="section-header section-header--center">
        <span class="section-eyebrow">Archived Events</span>
        <h2 class="section-heading">Past Event Galleries</h2>
      </div>

      <p class="archive-note">These event galleries have been archived and removed from the main gallery index. They remain accessible via direct link for historical reference.</p>

      <ul class="archive-list" id="archiveList"></ul>
    </div>
  </section>

  <a href="../gallery.html" class="event-back-link" style="display: inline-flex; margin-top: 2rem;">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Back to Gallery
  </a>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 Troop 99 Scouts, Newtown PA. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script>
    (function() {
      // Load gallery config to build archive list
      fetch('../../data/gallery-config.json')
        .then(res => res.json())
        .then(events => {
          const archived = events.filter(ev => ev.status === 'archived');
          const list = document.getElementById('archiveList');

          if (archived.length === 0) {
            list.innerHTML = '<li style="color: var(--gray-500);">No archived event galleries yet.</li>';
            return;
          }

          archived.forEach(ev => {
            const li = document.createElement('li');
            const monthNames = ['','January','February','March','April','May','June','July','August','September','October','November','December'];
            const dateStr = ev.month ? `${monthNames[ev.month]} ${ev.year}` : `${ev.year}`;
            li.innerHTML = `<a href="${ev.slug}.html">${ev.title} (${dateStr})</a>`;
            list.appendChild(li);
          });
        });
    })();
  </script>
</body>
</html>
